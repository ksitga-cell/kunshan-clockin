<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>崑山科大工讀簽到系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; text-align: center; background-color: #f5f5f5; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h2 { color: #333; margin-bottom: 5px; }
    #user-info { color: #666; font-size: 14px; margin-bottom: 25px; }
    button { width: 100%; padding: 15px; margin: 8px 0; font-size: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    .btn-in { background-color: #28a745; color: white; }
    .btn-out { background-color: #dc3545; color: white; }
    #status { margin-top: 20px; font-weight: bold; color: #0056b3; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>崑山科大工讀簽到</h2>
    <p id="user-info">載入個人資訊中...</p>
    
    <button class="btn-in" onclick="clockIn('上班')">上班打卡</button>
    <button class="btn-out" onclick="clockIn('下班')">下班打卡</button>
    
    <div id="status"></div>
  </div>

  <script>
    // 請替換為第一步取得的 LIFF ID 與第二步取得的 GAS Web App URL
    const LIFF_ID = "2012273086-9FqH4X6N"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwe0F2-r2uUQiS08lUwfgmhWYTQVyq1Zy94-cjZ30bWIgL7e_sKiDaeWW1onrBrp4T36w/exec"; 
    let currentUser = null;

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          currentUser = profile;
          document.getElementById('user-info').innerText = `哈囉，${profile.displayName}`;
        }
      } catch (err) {
        document.getElementById('status').innerText = "LIFF 初始化失敗：" + err.message;
      }
    }

    function clockIn(type) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "正在取得校區 GPS 定位...";

      if (!navigator.geolocation) {
        alert("您的裝置不支援 GPS 地理定位");
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        statusDiv.innerText = "驗證位置與上傳紀錄中...";
        const payload = {
          userId: currentUser.userId,
          userName: currentUser.displayName,
          type: type,
          latitude: position.coords.latitude,
          longitude: position.coords.longitude
        };

        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          statusDiv.innerText = result.message;
          if (result.success) {
            alert(`${type}打卡成功！`);
            liff.closeWindow(); // 成功後自動關閉頁面
          }
        } catch (err) {
          statusDiv.innerText = "打卡連線失敗，請檢查網路連線";
        }
      }, (err) => {
        statusDiv.innerText = "無法取得定位，請確認已授權手機瀏覽器存取「精確位置」";
      }, { enableHighAccuracy: true, timeout: 10000 });
    }

    initLiff();
  </script>
</body>
</html>
